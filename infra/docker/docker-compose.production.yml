# Production overlay — use with secrets manager / env injection

services:
  backend-api:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: WARNING
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      QUEUE_SCANS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
    restart: always
    deploy:
      replicas: 1

  worker-engine:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: production
      CELERY_ENABLED: "true"
    restart: always
    command: celery -A app.core.celery_app:celery_app worker -Q scans,email,ai,analytics,maintenance,default -l warning --concurrency=4

  scheduler:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: production
      CELERY_ENABLED: "true"
    restart: always
    command: celery -A app.core.celery_app:celery_app beat -l warning

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-api
      - frontend
    restart: always
