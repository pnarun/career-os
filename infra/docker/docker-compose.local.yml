# Local development overlay — extends root docker-compose.yml

services:
  backend-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: career-os-api
    ports:
      - "8001:8000"
    env_file:
      - ../../backend/.env.development
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-engine:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: career-os-worker
    env_file:
      - ../../backend/.env.development
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker -Q scans,email,ai,analytics,maintenance,default -l info

  scheduler:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: career-os-scheduler
    env_file:
      - ../../backend/.env.development
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app beat -l info

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001
    container_name: career-os-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-api
