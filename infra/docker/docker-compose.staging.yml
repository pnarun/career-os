# Staging overlay

services:
  backend-api:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: staging
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      QUEUE_SCANS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
    restart: unless-stopped

  worker-engine:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: staging
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker -Q scans,email,ai,analytics,maintenance,default -l info --concurrency=2

  scheduler:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: staging
      CELERY_ENABLED: "true"
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app beat -l info

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-api
      - frontend
    restart: unless-stopped
