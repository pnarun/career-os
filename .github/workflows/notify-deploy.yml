# Email admin when CI passes on main (deploys to Render + Vercel are triggered separately).
# Required GitHub repo secrets: CAREER_OS_API_URL, CRON_SECRET
# Optional: also wire Render/Vercel webhooks to POST /internal/notify/deploy (see docs).

name: Notify deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  notify-ci-success:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Email via Career OS API
        env:
          API_URL: ${{ secrets.CAREER_OS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: set CAREER_OS_API_URL and CRON_SECRET in GitHub repo secrets"
            exit 0
          fi
          curl -sf -X POST "${API_URL%/}/internal/notify/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d '{
              "component": "github-ci",
              "status": "success",
              "message": "GitHub CI passed (backend, frontend, docker). Render API and Vercel frontend auto-deploys should follow."
            }'
