# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render → New → Blueprint → select render.yaml
#
# After deploy, set secrets in the dashboard (MONGO_URI, JWT_SECRET_KEY, etc.)
# and FRONTEND_URL to your Vercel production URL.

services:
  - type: web
    name: career-os-api
    runtime: docker
    plan: starter
    region: singapore
    autoDeploy: true
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: python start_api.py
    envVars:
      - key: SERVICE_MODE
        value: api
      - key: SCAN_EXECUTION_MODE
        value: dispatch
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: ENABLE_REALTIME
        value: "true"
      - key: ENABLE_AUTOMATION
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_ENABLED
        value: "false"
      - key: CELERY_ENABLED
        value: "false"
      - key: QUEUE_SCANS_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: AUTH_DEV_EXPOSE_OTP
        value: "false"
      - key: AUTH_SEED_DEMO_USERS
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: web
    name: career-os-scan-worker
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: python start_scan_worker.py
    envVars:
      - key: SERVICE_MODE
        value: scan_worker
      - key: SCAN_EXECUTION_MODE
        value: dispatch
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENABLE_REALTIME
        value: "false"
      - key: ENABLE_AUTOMATION
        value: "false"
      - key: SCHEDULER_STARTUP_CATCHUP
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_ENABLED
        value: "false"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  # Keep-alive: use UptimeRobot → GET /health every 5 min (see docs/render_keepalive.md).
  # Render Cron Jobs are optional paid add-ons; not required for MVP.

  # - type: redis
  #   name: career-os-redis
  #   plan: starter
  #   ipAllowList: []
